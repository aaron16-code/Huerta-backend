spring.application.name=huerto-api
server.port=8080

# Para que la app pueda mostrar el mensaje de error que manda el servidor
server.error.include-message=always

# MySQL (XAMPP): la base se crea sola si no existe.
# Con XAMPP el usuario es root y la clave va vacia. Si tu MySQL tiene clave, cambiala aqui o usa la variable DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/huerto_escolar?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Las tablas y sus relaciones se crean solas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
